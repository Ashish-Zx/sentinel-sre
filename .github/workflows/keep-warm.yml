name: Keep Backend Warm

on:
  schedule:
    # Every 10 minutes, around the clock. Render free services spin down
    # after ~15 min idle; this ping keeps the instance awake (cold-start free).
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS -o /dev/null --max-time 30 https://sentinel-backend-ya71.onrender.com/api/health
