# Render Blueprint — SentinelSRE backend (Docker web service)
# Docs: https://render.com/docs/blueprint-spec
# Usage: connect this repo to Render, or run `render blueprint launch`.
# Secrets marked `sync: false` must be set manually in the Render dashboard.
services:
  - type: web
    name: sentinel-backend
    runtime: docker
    repo: https://github.com/Ashish-Zx/sentinel-sre
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false        # Your Neon/Supabase connection string
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: INCEPTION_API_KEY
        sync: false
      - key: INCEPTION_BASE_URL
        value: https://api.inceptionlabs.ai/v1
      - key: LLM_MODEL
        value: mercury-3
      - key: LLM_TEMPERATURE
        value: "0.75"
      - key: GITHUB_ACCESS_TOKEN
        sync: false
      - key: GITHUB_DEFAULT_REPO
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false        # GitHub OAuth App (per-user connections)
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK_URL
        sync: false        # Optional; defaults to {BACKEND_URL}/api/github/callback
      - key: FRONTEND_URL
        value: https://your-frontend.onrender.com
      - key: ENCRYPTION_KEY
        sync: false        # Fernet key for encrypting per-user GitHub tokens
      - key: SLACK_CLIENT_ID
        sync: false        # Slack OAuth App (per-user connections)
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_OAUTH_CALLBACK_URL
        sync: false        # Optional; defaults to {BACKEND_URL}/api/slack/callback
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false        # Optional rate limiting
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
